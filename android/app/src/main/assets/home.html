<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Carnelia Private Search</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 40px;
            background: linear-gradient(45deg, #00C853, #69F0AE);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            letter-spacing: 1px;
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            padding-right: 50px;
            font-size: 18px;
            background-color: #1E1E1E;
            border: 1px solid #333;
            border-radius: 30px;
            color: #fff;
            outline: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: #00C853;
            box-shadow: 0 4px 12px rgba(0, 200, 83, 0.2);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            fill: #888;
            cursor: pointer;
        }

        .features {
            margin-top: 60px;
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: #666;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: #00C853;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="logo">Carnelia<br><span style="font-size: 24px; font-weight: normal; -webkit-text-fill-color: #888;">Private Search</span></div>

    <div class="search-container">
        <form onsubmit="doSearch(event)">
            <input type="text" id="query" placeholder="Search anonymously..." autocomplete="off">
            <svg class="search-icon" onclick="document.forms[0].submit()" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
        </form>
    </div>

    <div class="features">
        <div class="feature"><div class="dot"></div>No Tracking</div>
        <div class="feature"><div class="dot"></div>No Ads</div>
        <div class="feature"><div class="dot"></div>VPN Protected</div>
    </div>

    <script>
        function doSearch(e) {
            e.preventDefault();
            const query = document.getElementById('query').value;
            if (query) {
                // Use DuckDuckGo (lite version for speed if preferred, or standard)
                window.location.href = 'https://duckduckgo.com/?q=' + encodeURIComponent(query);
            }
        }
        document.getElementById('query').focus();
    </script>
</body>
</html>
