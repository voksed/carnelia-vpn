name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build release APK
      run: ./gradlew assembleRelease

    - name: Upload APK to artifact
      uses: actions/upload-artifact@v3
      with:
        name: carnelia-vpn-release
        path: app/build/outputs/apk/release/

    - name: Sign APK
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > signing.keystore
        ./gradlew assembleRelease -Pandroid.injected.signing.store.file=signing.keystore \
                                   -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
                                   -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
                                   -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Carnelia VPN v${{ github.run_number }}
        body: |
          Build: ${{ github.run_number }}
          Commit: ${{ github.sha }}
