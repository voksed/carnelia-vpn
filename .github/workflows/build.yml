name: Build Carnelia VPN

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download Gradle Wrapper JAR
      run: |
        cd android
        mkdir -p gradle/wrapper
        curl -L https://services.gradle.org/distributions/gradle-8.6-bin.zip -o gradle-8.6.zip
        unzip -q gradle-8.6.zip
        cp gradle-8.6/lib/gradle-8.6.jar gradle/wrapper/gradle-wrapper.jar
        rm -rf gradle-8.6 gradle-8.6.zip

    - name: Grant execute permission for gradlew
      run: chmod +x ./android/gradlew

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

    - name: Build Debug APK
      working-directory: ./android
      run: ./gradlew assembleDebug --info

    - name: Find and upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: carnelia-vpn-debug
        path: android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
